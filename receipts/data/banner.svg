<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="t d">
  <title id="t">receipts — a research desk that cannot hallucinate</title>
  <desc id="d">Paper-coloured banner with the wordmark receipts, a receipt rule and the line: no model, no keys, every sentence is a quote.</desc>
  <rect width="1200" height="320" fill="#f7f5f0"/>
  <rect width="1200" height="10" fill="#8a1f11"/>
  <g font-family="Georgia, 'Times New Roman', serif" fill="#161616">
    <text x="64" y="152" font-size="116" font-weight="700" letter-spacing="-7">receipts</text>
    <text x="64" y="205" font-family="'Courier New', monospace" font-size="17" letter-spacing="1.4" fill="#6f6859">NO MODEL · NO KEYS · EVERY SENTENCE IS A QUOTE</text>
  </g>
  <g stroke="#d8d2c4" stroke-width="1">
    <line x1="64" y1="244" x2="1136" y2="244"/>
    <line x1="64" y1="272" x2="820" y2="272"/>
  </g>
  <g font-family="'Courier New', monospace" font-size="13" fill="#6f6859">
    <text x="64" y="298">quotes · urls · dates · the query that found them</text>
  </g>
  <g transform="translate(1018 168) rotate(-7)">
    <rect x="-92" y="-46" width="184" height="92" fill="none" stroke="#8a1f11" stroke-width="4"/>
    <rect x="-85" y="-39" width="170" height="78" fill="none" stroke="#8a1f11" stroke-width="1"/>
    <text x="0" y="-8" text-anchor="middle" font-family="'Courier New', monospace" font-size="13" letter-spacing="2.6" fill="#8a1f11">NO MODEL</text>
    <text x="0" y="12" text-anchor="middle" font-family="'Courier New', monospace" font-size="13" letter-spacing="2.6" fill="#8a1f11">NO KEYS</text>
    <text x="0" y="30" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" letter-spacing="1.8" fill="#8a1f11">EVIDENCE ONLY</text>
  </g>
</svg>
